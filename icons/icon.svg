<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#25663f"/>
      <stop offset="1" stop-color="#143b26"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#e6e4dd" stroke-opacity=".28" stroke-width="10">
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="136"/>
    <circle cx="256" cy="256" r="76"/>
  </g>
  <g stroke="#e6e4dd" stroke-opacity=".18" stroke-width="6">
    <line x1="256" y1="52" x2="256" y2="460"/>
    <line x1="52" y1="256" x2="460" y2="256"/>
  </g>
  <!-- Sweep: Kreissektor von 12 Uhr bis ca. 2 Uhr -->
  <path d="M256 256 L256 60 A196 196 0 0 1 425.7 158 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="425.7" y2="158" stroke="#ffd400" stroke-width="12" stroke-linecap="round"/>
  <!-- Ruine im Zentrum: Giebelhaus mit eingebrochenem Dach -->
